version: "3.7"

services:
  web:
    build: .
    environment:
      NODE_ENV:
      MONGODB_URI: mongodb://mongo:27017/nodegoat
    command: sh -c "until nc -z -w 2 mongo 27017 && echo 'mongo is ready for connections' && node artifacts/db-reset.js && npm start; do sleep 2; done"
    ports:
      - "4000:4000"

  mongo:
    image: mongo:4.4
    # Runs as the image's non-root mongodb account, so the entrypoint skips its
    # root-only chown/gosu branch and never needs a setuid step.
    user: mongodb
    # Block privilege escalation via setuid/setgid binaries inside the container.
    security_opt:
      - no-new-privileges:true
    expose:
      - 27017
    # Container root filesystem is immutable; only the paths mongod actually
    # writes to at runtime are mounted writable.
    read_only: true
    tmpfs:
      # mongod creates its unix domain socket (/tmp/mongodb-27017.sock) and the
      # entrypoint uses mktemp here.
      - /tmp
    volumes:
      # dbPath: WiredTiger data files, journal, mongod.lock, diagnostic.data.
      - mongo-data:/data/db
      # Written by the mongo image entrypoint / mongod configuration directory.
      - mongo-configdb:/data/configdb

volumes:
  mongo-data:
  mongo-configdb:
