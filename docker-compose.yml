version: "3.7"

services:
  web:
    build: .
    environment:
      NODE_ENV:
      MONGODB_URI: mongodb://mongo:27017/nodegoat
    command: sh -c "until nc -z -w 2 mongo 27017 && echo 'mongo is ready for connections' && node artifacts/db-reset.js && npm start; do sleep 2; done"
    ports:
      - "4000:4000"

  mongo:
    image: mongo:4.4
    user: mongodb
    read_only: true
    security_opt:
      # Block privilege escalation through setuid/setgid binaries in the image.
      - no-new-privileges:true
    expose:
      - 27017
    volumes:
      # mongod needs these writable; the rest of the root filesystem stays read-only.
      - mongo-data:/data/db
      - mongo-configdb:/data/configdb
    tmpfs:
      # mongod unix socket (/tmp/mongodb-27017.sock) and entrypoint temp files.
      - /tmp

volumes:
  mongo-data:
  mongo-configdb:
